[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "robustness-testing-framework"
version = "1.0.0"
description = "Post-search robustness validation and quantitative kill-switch calibration for trading strategies"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "TheQuantGPT Lab" }]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.11",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
rtf = "rtf.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["rtf*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
